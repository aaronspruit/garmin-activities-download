apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garmin-tokens-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi  # Adjust to your StorageClass minimum
---
apiVersion: v1
kind: Secret
metadata:
  name: garmin-credentials
type: Opaque
stringData:
  GARMIN_EMAIL: "your@email.com"
  GARMIN_PASSWORD: "your-password"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: garmin-activity-sync
spec:
  schedule: "0 6 * * *"  # Daily at 6 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          volumes:
            - name: token-storage
              persistentVolumeClaim:
                claimName: garmin-tokens-pvc
            # Configure your data volume here:
            # Option A: hostPath (single-node clusters)
            - name: data-storage
              hostPath:
                path: /data/garmin-gpx
                type: DirectoryOrCreate
            # Option B: PVC (multi-node clusters)
            # - name: data-storage
            #   persistentVolumeClaim:
            #     claimName: garmin-data-pvc
          containers:
            - name: garmin-sync
              image: ghcr.io/OWNER/garmin-activities-download:latest
              env:
                - name: GARMINTOKENS
                  value: /app/tokens
                - name: OUTPUT_DIR
                  value: /app/data
                - name: DAYS_BACK
                  value: "7"
                - name: GARMIN_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: garmin-credentials
                      key: GARMIN_EMAIL
                - name: GARMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: garmin-credentials
                      key: GARMIN_PASSWORD
              volumeMounts:
                - name: token-storage
                  mountPath: /app/tokens
                - name: data-storage
                  mountPath: /app/data
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
