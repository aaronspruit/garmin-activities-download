apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garmin-tokens-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi  # Adjust to your StorageClass minimum
---
apiVersion: v1
kind: Secret
metadata:
  name: garmin-credentials
type: Opaque
stringData:
  GARMIN_EMAIL: "your@email.com"
  GARMIN_PASSWORD: "your-password"
---
# Only needed with "wahoo" in TRACKERS. Register an application at the Wahoo
# developer portal to obtain these, then seed the tokens into the PVC with
# `python -m src.setup wahoo` from an interactive pod.
# apiVersion: v1
# kind: Secret
# metadata:
#   name: wahoo-credentials
# type: Opaque
# stringData:
#   WAHOO_CLIENT_ID: "your-client-id"
#   WAHOO_CLIENT_SECRET: "your-client-secret"
# ---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: garmin-activity-sync
spec:
  schedule: "0 6 * * *"  # Daily at 6 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          # The image runs as UID 1000, but that is an image convention, not a
          # guarantee. Assert it here instead, so it holds against any tag.
          # fsGroup makes the kubelet chown mounted PVCs to this group, which is
          # what lets the non-root process write to them.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          volumes:
            - name: token-storage
              persistentVolumeClaim:
                claimName: garmin-tokens-pvc
            # Configure your data volume here:
            # Option A: hostPath (single-node clusters)
            #
            # NOTE: fsGroup does NOT apply to hostPath volumes. DirectoryOrCreate
            # creates this path as root:root 0755, which the non-root container
            # cannot write to. Create it on the node with the right owner before
            # the first run:
            #     sudo mkdir -p /data/garmin-gpx && sudo chown 1000:1000 /data/garmin-gpx
            # Option B avoids this entirely.
            - name: data-storage
              hostPath:
                path: /data/garmin-gpx
                type: DirectoryOrCreate
            # Option B: PVC (multi-node clusters)
            # - name: data-storage
            #   persistentVolumeClaim:
            #     claimName: garmin-data-pvc
          containers:
            - name: garmin-sync
              image: ghcr.io/OWNER/garmin-activities-download:latest
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                # Comma-separated trackers: garmin, wahoo. Each keeps its own
                # tokens under TOKENS_DIR/<tracker>. One tracker failing does
                # not stop the others; the exit code reports the worst result.
                - name: TRACKERS
                  value: "garmin"
                - name: TOKENS_DIR
                  value: /app/tokens
                - name: OUTPUT_DIR
                  value: /app/data
                - name: DAYS_BACK
                  value: "7"
                # Comma-separated targets: FIT, GPX, or TCX, each with an optional
                # :folder override, e.g. "FIT:strava-inbox,FIT:archive,GPX"
                # A tracker skips formats it cannot supply -- Wahoo is FIT only.
                - name: DOWNLOAD_FORMATS
                  value: "FIT"
                - name: GARMIN_EMAIL
                  valueFrom:
                    secretKeyRef:
                      name: garmin-credentials
                      key: GARMIN_EMAIL
                - name: GARMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: garmin-credentials
                      key: GARMIN_PASSWORD
                # Uncomment with "wahoo" in TRACKERS, along with the Secret
                # above. Wahoo needs these on EVERY run, not just at setup:
                # they refresh the 2-hour access token.
                # - name: WAHOO_CLIENT_ID
                #   valueFrom:
                #     secretKeyRef:
                #       name: wahoo-credentials
                #       key: WAHOO_CLIENT_ID
                # - name: WAHOO_CLIENT_SECRET
                #   valueFrom:
                #     secretKeyRef:
                #       name: wahoo-credentials
                #       key: WAHOO_CLIENT_SECRET
              volumeMounts:
                - name: token-storage
                  mountPath: /app/tokens
                - name: data-storage
                  mountPath: /app/data
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
